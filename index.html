    <!-- Orbitron/Share Tech Mono are referenced throughout index.css as --font-display/
         --font-mono but were never actually loaded anywhere in the app — every visitor was
         silently falling back to the browser's generic sans-serif/monospace. This is what
         makes them real. (Rajdhani/--font-rajdhani is still defined as a token but unused —
         a prose-copy pass through it didn't land, so it's not worth the extra font load.) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
  </head>
